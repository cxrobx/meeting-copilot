# The update channel's identity, sourced by build-app.sh, verify-app.sh,
# release.sh and verify-update-feed.sh so they can never disagree.
#
# SPARKLE_PUBLIC_KEY is the public half of the EdDSA key in the login Keychain
# as Sparkle account "meeting-copilot" (generate_keys --account meeting-copilot),
# backed up in the secrets store as SPARKLE_ED_PRIVATE_MEETING_COPILOT. Lose
# both and no installed copy can ever update again: changing this key strands
# every copy already out there. See docs/updates.md.
SPARKLE_VERSION="2.10.0"
SPARKLE_ACCOUNT="meeting-copilot"
SPARKLE_PUBLIC_KEY="y/DCC/FQOUGnRr1Lc7mmkJ6DTUqo3fEuF8Pz6kRg7WU="
GITHUB_REPO="cxrobx/meeting-copilot"
SPARKLE_FEED_URL="https://github.com/$GITHUB_REPO/releases/latest/download/appcast.xml"
